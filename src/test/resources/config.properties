# OrangeHRM BDD Framework \u2014 runtime configuration
# Every value can be overridden from the command line, e.g.:
#   mvn test -Dbrowser=firefox -Dheadless=false -DbaseUrl=https://opensource-demo.orangehrmlive.com

baseUrl=https://opensource-demo.orangehrmlive.com
browser=chrome
headless=true
# Window size used in headless mode
windowSize=1920,1080
# Default explicit-wait timeout in seconds (explicit waits only \u2014 implicit wait is 0)
explicitWait=30
pageLoadTimeout=60

# Default login used by the Background steps
admin.username=Admin
admin.password=admin123

# Leave entitlement added by the smoke Leave scenario's Given step
# (EntitlementPage) for whoever is logged in at run time
leave.entitlementDays=10
